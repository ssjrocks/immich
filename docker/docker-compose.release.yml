#
# Runs a published release of this CUSTOMISED version of Immich (github.com/ssjrocks/immich).
# It is not the official Immich app.
#
#   1. Put this file and example.env in an empty folder, and rename example.env to .env
#   2. Edit .env: set UPLOAD_LOCATION, DB_DATA_LOCATION and DB_PASSWORD, and set IMMICH_VERSION to a
#      release tag from https://github.com/ssjrocks/immich/releases
#   3. docker compose -f docker-compose.release.yml up -d
#
# To build from source instead, use docker-compose.fork.yml from the repository.

name: immich

services:
  immich-server:
    container_name: immich_server
    image: ghcr.io/ssjrocks/immich-server:${IMMICH_VERSION:-latest}
    volumes:
      # Do not edit the next line. If you want to change the media storage location on your system, edit the value of UPLOAD_LOCATION in the .env file
      - ${UPLOAD_LOCATION}:/data
      - /etc/localtime:/etc/localtime:ro
    env_file:
      - .env
    ports:
      - '2283:2283'
    depends_on:
      - redis
      - database
    restart: always
    healthcheck:
      disable: false

  immich-machine-learning:
    container_name: immich_machine_learning
    image: ghcr.io/ssjrocks/immich-machine-learning:${IMMICH_VERSION:-latest}
    volumes:
      - model-cache:/cache
    env_file:
      - .env
    restart: always
    healthcheck:
      disable: false

  redis:
    container_name: immich_redis
    image: docker.io/valkey/valkey:9@sha256:70739f85ad2ee01a726a965584a0f94895f01b0c60b3cc8b0aeef11eaa6888cf
    healthcheck:
      test: redis-cli ping | grep -q PONG || exit 1
    restart: always

  database:
    container_name: immich_postgres
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_DATABASE_NAME}
      POSTGRES_INITDB_ARGS: '--data-checksums'
    volumes:
      # Do not edit the next line. If you want to change the database storage location on your system, edit the value of DB_DATA_LOCATION in the .env file
      - ${DB_DATA_LOCATION}:/var/lib/postgresql/data
    shm_size: 128mb
    restart: always
    healthcheck:
      disable: false

volumes:
  model-cache:
