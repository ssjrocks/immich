# Static server for the offline map assets (PMTiles archive, style JSONs, glyph
# PBFs, sprites). Everything is served straight off disk — no upstream, no network.
#
# Two things matter here beyond plain file serving:
#   1. CORS. The Immich page runs on :2283 and fetches these from :8082, so every
#      response needs permissive CORS or the browser blocks it.
#   2. Range requests. The pmtiles client reads small byte ranges out of the 3.5GB
#      archive rather than downloading it; nginx serves ranges for static files by
#      default, but the Range/Content-Range headers must survive CORS, hence the
#      explicit allow/expose lists below.
server {
    listen 8082;
    server_name _;

    root /srv/maps;
    autoindex off;

    # Vector tiles inside PMTiles are gzipped already; don't re-compress.
    gzip off;

    types {
        application/json          json;
        application/x-protobuf    pbf;
        image/png                 png;
    }
    default_type application/octet-stream;

    location / {
        add_header Access-Control-Allow-Origin  "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Range, If-Match, If-None-Match, Cache-Control" always;
        add_header Access-Control-Expose-Headers "Content-Length, Content-Range, ETag, Accept-Ranges" always;
        add_header Accept-Ranges bytes always;

        # These never change for a given bundle, so let the browser keep them.
        add_header Cache-Control "public, max-age=604800, immutable" always;

        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin  "*" always;
            add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Range, If-Match, If-None-Match, Cache-Control" always;
            add_header Access-Control-Max-Age 86400 always;
            add_header Content-Length 0;
            return 204;
        }

        try_files $uri =404;
    }
}
