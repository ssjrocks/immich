# Builds and publishes this fork's images, then creates a release.
#
# Trigger it by pushing a tag, for example:
#   git tag v3.2.1-fork.1 && git push origin v3.2.1-fork.1
#
# Images are published to ghcr.io/<owner>/immich-server and ghcr.io/<owner>/immich-machine-learning,
# tagged with the version and 'latest'. docker/docker-compose.release.yml runs them.
name: Fork Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  images:
    name: Build and publish ${{ matrix.image }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: immich-server
            context: .
            dockerfile: server/Dockerfile
            device_arg: ''
          - image: immich-machine-learning
            context: machine-learning
            dockerfile: machine-learning/Dockerfile
            # cpu is the build that includes Whisper, for video subtitles
            device_arg: DEVICE=cpu
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Free up runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Work out image tags
        id: tags
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          IMAGE: ${{ matrix.image }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          name="ghcr.io/${owner}/${IMAGE}"
          # notes come from .github/release-notes-template.md, with the tag filled in
          sed "s/__TAG__/${TAG}/g" .github/release-notes-template.md > notes.md
          gh release create "$TAG" \
            --repo "$REPOSITORY" \
            --title "$TAG" \
            --notes-file notes.md \
            docker/docker-compose.release.yml \
            docker/example.fork.env
